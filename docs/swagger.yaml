basePath: /api
definitions:
  handlers.Contributor:
    properties:
      avatar_url:
        type: string
      contributions:
        type: integer
      html_url:
        type: string
      id:
        type: integer
      login:
        type: string
      type:
        type: string
    type: object
  handlers.ValidateRequest:
    properties:
      json:
        example: '{"key":"value"}'
        type: string
      type:
        example: generic
        type: string
    type: object
host: localhost:3001
info:
  contact:
    name: Support
    url: https://fixfx.wiki/discord
  description: Backend API for FixFX documentation and tools
  title: FixFX API
  version: 0.1.0
paths:
  /artifacts/changes:
    get:
      description: Get changelog/commits between two artifact versions
      parameters:
      - description: Base version for comparison
        in: query
        name: base
        type: string
      - description: Head version for comparison
        in: query
        name: head
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get artifact changelog
      tags:
      - Artifacts
  /artifacts/check:
    get:
      description: Check the status and availability of an artifact
      parameters:
      - description: Version to check
        in: query
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Check artifact status
      tags:
      - Artifacts
  /artifacts/fetch:
    get:
      description: Fetch FiveM/RedM server artifacts with filtering and pagination
      parameters:
      - default: all
        description: Platform (windows/linux/all)
        in: query
        name: platform
        type: string
      - description: Specific version to fetch
        in: query
        name: version
        type: string
      - description: Filter by status (recommended/latest/active/deprecated/eol)
        in: query
        name: status
        type: string
      - default: version
        description: Sort by (version/date)
        in: query
        name: sortBy
        type: string
      - default: desc
        description: Sort order (asc/desc)
        in: query
        name: sortOrder
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: true
        description: Include end-of-life artifacts
        in: query
        name: includeEol
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get artifacts
      tags:
      - Artifacts
  /artifacts/version/{version}:
    get:
      description: Fetch a specific artifact version
      parameters:
      - description: Artifact version
        in: path
        name: version
        required: true
        type: string
      - description: Platform filter
        in: query
        name: platform
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get artifact by version
      tags:
      - Artifacts
  /contributors:
    get:
      description: Fetch merged contributors from the FixFX and FixFX-Core GitHub
        repositories, sorted by total contributions
      parameters:
      - description: Maximum number of contributors to return (0 = all)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.Contributor'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get contributors
      tags:
      - Contributors
  /contributors/stats:
    get:
      description: Return aggregate statistics about contributors across the FixFX
        and FixFX-Core repositories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get contributor statistics
      tags:
      - Contributors
  /game-references/blips:
    get:
      description: Fetch all minimap blip sprites and the blip colour palette with
        optional search and pagination
      parameters:
      - description: Filter by blip name
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get map blips
      tags:
      - Game References
  /game-references/checkpoints:
    get:
      description: Fetch all CREATE_CHECKPOINT type IDs with labels, optionally filtered
        by section
      parameters:
      - description: Filter by checkpoint ID or label
        in: query
        name: search
        type: string
      - description: Filter by section (standard/type-44-46)
        in: query
        name: section
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get checkpoint types
      tags:
      - Game References
  /game-references/data-files:
    get:
      description: Fetch all data_file keys used in resource manifests with file type,
        root element, and mounter details
      parameters:
      - description: Filter by key, file type, or mounter
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get resource manifest data file types
      tags:
      - Game References
  /game-references/game-events:
    get:
      description: Fetch all client-side game events available for resource scripting
        with descriptions
      parameters:
      - description: Filter by event name or description
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get client-side game events
      tags:
      - Game References
  /game-references/gamer-tags:
    get:
      description: Fetch all head display component IDs for SET_MULTIPLAYER_HANGER_COLOUR
        and related natives
      parameters:
      - description: Filter by component name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get gamer tag components
      tags:
      - Game References
  /game-references/hud-colors:
    get:
      description: Fetch all HUD colour indices with RGBA values and hex codes for
        use with HUD_COLOUR_* constants
      parameters:
      - description: Filter by color name or hex value
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get HUD colors
      tags:
      - Game References
  /game-references/markers:
    get:
      description: Fetch all DRAW_MARKER type IDs with name labels
      parameters:
      - description: Filter by marker name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get DRAW_MARKER types
      tags:
      - Game References
  /game-references/net-game-events:
    get:
      description: Fetch all GTA_EVENT_IDS enum entries with sequential IDs for network
        event handling
      parameters:
      - description: Filter by event name
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get net game events
      tags:
      - Game References
  /game-references/ped-models:
    get:
      description: Fetch all pedestrian model names grouped by category, suitable
        for use with REQUEST_MODEL and GET_HASH_KEY
      parameters:
      - description: Filter by model name or category
        in: query
        name: search
        type: string
      - description: Filter by category name
        in: query
        name: category
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get pedestrian models
      tags:
      - Game References
  /game-references/pickup-hashes:
    get:
      description: Fetch all ePickupHashes enum entries with numeric hash values for
        use with CREATE_PICKUP_ROTATE and related natives
      parameters:
      - description: Filter by pickup name or hash
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get pickup hashes
      tags:
      - Game References
  /game-references/vehicle-colours:
    get:
      description: Fetch all vehicle paint colour indices grouped by type (metallic,
        matte, metals, unnamed) for use with SET_VEHICLE_COLOURS and related natives
      parameters:
      - description: Filter by colour name or type
        in: query
        name: search
        type: string
      - description: Filter by colour type (metallic/matte/metals/unnamed)
        in: query
        name: type
        type: string
      - default: 200
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get vehicle colours
      tags:
      - Game References
  /game-references/vehicle-flags:
    get:
      description: Fetch all vehicle flag definitions with descriptions and the build
        version they were introduced in
      parameters:
      - description: Filter by flag name or description
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get vehicle flags
      tags:
      - Game References
  /game-references/vehicle-models:
    get:
      description: Fetch all GTA V / FiveM vehicle model names and hashes grouped
        by category, suitable for use with REQUEST_MODEL and GET_HASH_KEY
      parameters:
      - description: Filter by display name, model name, or category
        in: query
        name: search
        type: string
      - description: Filter by vehicle category
        in: query
        name: category
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get vehicle models
      tags:
      - Game References
  /game-references/weapon-models:
    get:
      description: Fetch all weapon model names grouped by type with hash keys, DLC
        info, components, and tints
      parameters:
      - description: Filter by weapon name, hash, or group
        in: query
        name: search
        type: string
      - description: Filter by weapon group
        in: query
        name: group
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get weapon models
      tags:
      - Game References
  /game-references/zones:
    get:
      description: Fetch all 1300+ map zone name IDs with descriptions for area detection
        scripting
      parameters:
      - description: Filter by zone name, ID, or description
        in: query
        name: search
        type: string
      - default: 100
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get map zones
      tags:
      - Game References
  /health:
    get:
      description: Check if the API is running and get version information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - Health
  /natives:
    get:
      description: Fetch game natives with filtering and search
      parameters:
      - default: gta5
        description: Game (gta5/rdr3)
        in: query
        name: game
        type: string
      - default: all
        description: Environment (client/server/shared/all)
        in: query
        name: environment
        type: string
      - description: Namespace filter
        in: query
        name: namespace
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: true
        description: Include CFX natives
        in: query
        name: includeCfx
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get game natives
      tags:
      - Natives
  /natives/{hash}:
    get:
      description: Fetch a specific native by its hash
      parameters:
      - description: Native hash
        in: path
        name: hash
        required: true
        type: string
      - default: gta5
        description: Game (gta5/rdr3)
        in: query
        name: game
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get native by hash
      tags:
      - Natives
  /natives/search:
    get:
      description: Search across all native functions
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: gta5
        description: Game (gta5/rdr3)
        in: query
        name: game
        type: string
      - description: Environment filter
        in: query
        name: environment
        type: string
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Search natives
      tags:
      - Natives
  /natives/stats:
    get:
      description: Get statistics about available natives
      parameters:
      - default: gta5
        description: Game (gta5/rdr3)
        in: query
        name: game
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get natives statistics
      tags:
      - Natives
  /source:
    get:
      description: Securely read and return source file contents with syntax highlighting
      parameters:
      - description: File path (relative to project root)
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Path not provided or invalid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Path not allowed (not in whitelist)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: File not found
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Read source file
      tags:
      - Source
  /validator/info:
    get:
      description: Get available validation types, txAdmin placeholders, and schema
        info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get validator information
      tags:
      - Validator
  /validator/validate:
    post:
      consumes:
      - application/json
      description: Validate JSON with optional txAdmin embed/config schema validation
      parameters:
      - description: JSON to validate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Validate JSON
      tags:
      - Validator
schemes:
- http
- https
swagger: "2.0"
